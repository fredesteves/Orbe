<script>
(()=>{
/* ===== Base ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ls={get(k,d){try{const v=localStorage.getItem('orbe:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('orbe:'+k,JSON.stringify(v))}catch(e){}}};
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,ms)}
const TRIG={leg:'trig_018QktDwW7UZn3r4urpfUiuc',pautas:'trig_01AoWE3VbLUeftTUXUgbJJdS',roupa:'trig_01CyXfDhqQXP7KACvPDjHzWf'};
const CAP={db:null,user:null,sample:null,assets:null,downloads:null,mcp:null,id:null};
let PERFIL=ls.get('perfil',null), AGENDA=[], PAUTAS=null, GANHOS=[], VITRINE=[];
const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function aiErr(e){console.warn('orbe',e);const c=e&&e.code;if(c==='off')return 'A IA funciona com o Orbe aberto no Claude, na sua conta.';if(c==='not_granted')return 'Você não permitiu o uso do Claude nesta página. Recarregue e permita.';if(c==='rate_limited')return 'Muitos pedidos seguidos. Espere um minuto e tente de novo.';return 'A IA não respondeu agora. Tente de novo.'}
function perfilTxt(){const p=PERFIL||{};return `Criador: ${p.nome||'não informado'}. Faz: ${p.profissao||'não informado'}. Público: ${p.publico||'geral'}. Tom: ${p.tom||'próximo'}. Nichos: ${(p.nichos||[]).join(', ')||'não informado'}. Chamada para ação: ${p.cta||'seguir o perfil'}. Regras: ${p.regras||'nenhuma'}. Nunca prometa ganho, cura ou resultado garantido. Escreva em português do Brasil.`}
async function aiJson(prompt,opts={}){if(!CAP.sample)throw {code:'off'};return CAP.sample.json(perfilTxt()+'\n\n'+prompt,{cache:false,...opts})}
async function save(filename,data){if(!CAP.downloads){toast('Abra o Orbe no Claude para salvar arquivos.');return false}try{const r=await CAP.downloads.save({filename,data});return r}catch(e){toast('O arquivo não foi salvo.');return false}}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado.')}catch(e){toast('Não consegui copiar. Selecione o texto e copie à mão.')}}
